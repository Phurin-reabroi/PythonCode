<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Enterprise Management System</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        :root {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --border: #e2e8f0;
            --danger: #ef4444;
            --danger-bg: rgba(239, 68, 68, 0.1);
        }

        .dark-theme {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }

        .login-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            width: 400px;
            padding: 40px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            animation: slideUp 0.5s ease;
            position: relative;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .brand-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-icon {
            width: 48px;
            height: 48px;
            background-color: var(--primary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.5rem;
            color: #ffffff;
            margin: 0 auto 16px auto;
        }

        .brand-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .brand-subtitle {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 0.875rem;
            font-weight: 500;
        }

        .form-control {
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.875rem;
            outline: none;
            background-color: var(--bg-primary);
            color: var(--text-main);
            transition: border-color 0.2s;
            width: 100%;
        }

        .form-control:focus {
            border-color: var(--primary);
        }

        .btn-submit {
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .btn-submit:disabled {
            background-color: var(--text-muted);
            cursor: not-allowed;
        }

        /* Error Banner animation */
        .error-banner {
            display: none;
            background-color: var(--danger-bg);
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 12px;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 24px;
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        /* Theme button at bottom corner */
        .theme-toggle-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
        }

        .theme-btn {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--text-muted);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: all 0.2s;
        }

        .theme-btn:hover {
            color: var(--primary);
            transform: scale(1.05);
        }

        /* Loading Spinner */
        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand-header">
            <div class="brand-icon">M</div>
            <h1 class="brand-title">Matrix Console</h1>
            <p class="brand-subtitle">Sign in to control the system</p>
        </div>

        <div class="error-banner" id="errorBanner">
            Invalid username or password! Please try again.
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username / Operator ID</label>
                <input type="text" id="username" class="form-control" placeholder="Enter 'admin'" required autocomplete="off">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-control" placeholder="Enter 'password123'" required autocomplete="off">
            </div>
            <button type="submit" class="btn-submit" id="submitBtn">
                <div class="spinner" id="spinner"></div>
                <span id="btnText">Sign In</span>
            </button>
        </form>
    </div>

    <div class="theme-toggle-container">
        <button class="theme-btn" id="themeBtn">☀️</button>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const errorBanner = document.getElementById('errorBanner');
        const submitBtn = document.getElementById('submitBtn');
        const spinner = document.getElementById('spinner');
        const btnText = document.getElementById('btnText');
        const themeBtn = document.getElementById('themeBtn');

        // Check if theme was saved previously
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-theme');
            themeBtn.textContent = '🌙';
        }

        // Theme trigger
        themeBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-theme');
            const isDark = document.body.classList.contains('dark-theme');
            themeBtn.textContent = isDark ? '🌙' : '☀️';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });

        // Form Submit Login controller
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            errorBanner.style.display = 'none';

            const user = usernameInput.value.trim();
            const pass = passwordInput.value;

            // Trigger Loading state
            submitBtn.disabled = true;
            spinner.style.display = 'block';
            btnText.textContent = 'Authenticating...';

            setTimeout(() => {
                // Mock verification
                if (user === 'admin' && pass === 'password123') {
                    // Save Session State
                    sessionStorage.setItem('isLoggedIn', 'true');
                    sessionStorage.setItem('username', 'Admin Developer');
                    // Redirect to the dashboard
                    window.location.href = 'index.html';
                } else {
                    // Restore UI & Show shake error
                    submitBtn.disabled = false;
                    spinner.style.display = 'none';
                    btnText.textContent = 'Sign In';
                    
                    errorBanner.style.display = 'block';
                    // Re-trigger CSS animation
                    errorBanner.style.animation = 'none';
                    errorBanner.offsetHeight; /* trigger reflow */
                    errorBanner.style.animation = null; 
                }
            }, 1200); // realistic mock latency check
        });
    </script>
</body>
</html>
